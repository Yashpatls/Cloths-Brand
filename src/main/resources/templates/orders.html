<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments :: head('My Order History')}"></th:block>
</head>
<body>

  <div th:replace="~{fragments :: header}"></div>

  <main class="container py-5">
    <div class="mb-4">
      <span class="text-uppercase small fw-bold text-muted">CUSTOMER ARCHIVE</span>
      <h1 class="display-6 font-serif mt-1">My Orders</h1>
    </div>

    <div th:if="${orders.isEmpty()}" class="text-center py-5 bg-light rounded-3">
      <i class="bi bi-box-seam fs-1 text-muted d-block mb-3"></i>
      <h4 class="font-serif">No orders placed yet</h4>
      <p class="text-muted">Once you place your first order, you can track delivery progress here.</p>
      <a href="/shop" class="btn btn-fashion-dark mt-2">Explore Collections</a>
    </div>

    <div class="row g-4" th:unless="${orders.isEmpty()}">
      <div class="col-12" th:each="order : ${orders}">
        <div class="card border rounded-3 p-4 shadow-sm bg-white">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 border-bottom pb-3 mb-3">
            <div>
              <span class="small text-muted">Order Placed: <strong th:text="${order.formattedDate}">Date</strong></span>
              <div class="font-monospace fw-bold text-dark fs-5" th:text="${order.orderNumber}">SH-0000</div>
            </div>
            <div class="d-flex align-items-center gap-3">
              <span class="badge px-3 py-2 text-uppercase"
                    th:classappend="${order.status.name() == 'DELIVERED'} ? 'bg-success' : 'bg-dark'"
                    th:text="${order.status}">PLACED</span>
              <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-fashion-light">View Details & Tracking</a>
            </div>
          </div>

          <div class="row align-items-center">
            <div class="col-md-8">
              <div class="d-flex gap-3 flex-wrap">
                <div th:each="item : ${order.items}" class="d-flex align-items-center gap-2">
                  <img th:src="${item.productImage}" class="rounded" style="width: 50px; height: 65px; object-fit: cover;" th:alt="${item.productName}">
                  <div class="small">
                    <strong th:text="${item.productName}">Name</strong>
                    <div class="text-muted" th:text="'Qty: ' + ${item.quantity} + ' (' + ${item.selectedSize} + ')'"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-4 text-md-end mt-3 mt-md-0">
              <span class="small text-muted d-block">Total Amount</span>
              <strong class="fs-5 font-serif text-dark" th:text="'₹' + ${order.total}">₹0</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments :: footer}"></div>

</body>
</html>
