<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{admin/admin-fragments :: admin-head('Sales Analytics & Reports')}"></th:block>
</head>
<body class="admin-body">

  <div th:replace="~{admin/admin-fragments :: sidebar}"></div>

  <main class="admin-main">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1">Sales Reports & Analytics</h2>
        <span class="text-muted small">Financial summaries, order volumes, and customer acquisition metrics</span>
      </div>
    </div>

    <!-- Metrics Cards -->
    <div class="row g-4 mb-4">
      <div class="col-md-4">
        <div class="kpi-card text-center">
          <div class="kpi-title">Gross Revenue</div>
          <div class="kpi-value text-success" th:text="'₹' + ${totalRevenue}">₹0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="kpi-card text-center">
          <div class="kpi-title">Total Orders Fulfilled</div>
          <div class="kpi-value" th:text="${totalOrders}">0</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="kpi-card text-center">
          <div class="kpi-title">Active Customer Accounts</div>
          <div class="kpi-value" th:text="${totalCustomers}">0</div>
        </div>
      </div>
    </div>

    <!-- Recent Sales Table -->
    <div class="admin-table">
      <div class="p-3 border-bottom bg-white d-flex justify-content-between align-items-center">
        <h5 class="fw-bold mb-0">Order Sales Ledger</h5>
        <button class="btn btn-sm btn-outline-secondary" onclick="window.print()"><i class="bi bi-printer me-1"></i> Print Report</button>
      </div>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Order Ref</th>
              <th>Customer</th>
              <th>Subtotal</th>
              <th>Discount</th>
              <th>Tax</th>
              <th>Total Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="o : ${orders}">
              <td><code class="fw-bold" th:text="${o.orderNumber}">SH-000</code></td>
              <td th:text="${o.customer.name}">Customer</td>
              <td th:text="'₹' + ${o.subtotal}">₹0</td>
              <td class="text-success" th:text="'-₹' + ${o.discountAmount}">-₹0</td>
              <td th:text="'₹' + ${o.taxAmount}">₹0</td>
              <td><strong th:text="'₹' + ${o.total}">₹0</strong></td>
              <td>
                <span class="badge-status" th:classappend="'status-' + ${#strings.toLowerCase(o.status)}" th:text="${o.status}">PLACED</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
