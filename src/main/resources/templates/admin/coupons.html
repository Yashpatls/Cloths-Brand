<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{admin/admin-fragments :: admin-head('Coupons & Discounts')}"></th:block>
</head>
<body class="admin-body">

  <div th:replace="~{admin/admin-fragments :: sidebar}"></div>

  <main class="admin-main">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1">Discount Coupons</h2>
        <span class="text-muted small">Promotional privilege codes, percentage discounts, and order thresholds</span>
      </div>
      <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#newCouponModal">
        <i class="bi bi-plus-lg me-1"></i> Create Coupon
      </button>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${successMessage}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="admin-table">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Code</th>
              <th>Type</th>
              <th>Discount Value</th>
              <th>Min Order</th>
              <th>Redemptions</th>
              <th>Expiry</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="c : ${coupons}">
              <td><span class="badge bg-dark font-monospace fs-6 px-3 py-2" th:text="${c.code}">STYLE20</span></td>
              <td th:text="${c.discountType}">PERCENTAGE</td>
              <td>
                <strong th:if="${c.discountType.name() == 'PERCENTAGE'}" th:text="${c.discountValue} + '%'">20%</strong>
                <strong th:if="${c.discountType.name() == 'FIXED_AMOUNT'}" th:text="'₹' + ${c.discountValue}">₹100</strong>
              </td>
              <td th:text="'₹' + ${c.minOrderAmount}">₹0</td>
              <td><span th:text="${c.usedCount}">0</span> / <span th:text="${c.usageLimit}">1000</span></td>
              <td class="small text-muted" th:text="${c.expiryDate != null ? c.expiryDate : 'No Expiry'}">Date</td>
              <td>
                <span class="badge" th:classappend="${c.active} ? 'bg-success' : 'bg-secondary'"
                      th:text="${c.active ? 'Active' : 'Inactive'}">Active</span>
              </td>
              <td>
                <form th:action="@{/admin/coupons/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Delete this coupon code?')">
                  <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash3"></i></button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Create Coupon Modal -->
  <div class="modal fade" id="newCouponModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form th:action="@{/admin/coupons/save}" method="post">
          <div class="modal-header">
            <h5 class="modal-title font-serif">Create Promotional Code</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Promo Code</label>
              <input type="text" name="code" class="form-control text-uppercase font-monospace" required placeholder="e.g. VIP25">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Discount Type</label>
              <select name="discountType" class="form-select">
                <option value="PERCENTAGE">Percentage (%)</option>
                <option value="FIXED_AMOUNT">Flat Amount (₹)</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Discount Value</label>
              <input type="number" step="0.01" name="discountValue" class="form-control" required placeholder="e.g. 20">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Minimum Order Amount (₹)</label>
              <input type="number" step="0.01" name="minOrderAmount" class="form-control" value="0.00">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Max Discount Cap (₹)</label>
              <input type="number" step="0.01" name="maxDiscountAmount" class="form-control" placeholder="Optional cap">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Expiry Date</label>
              <input type="date" name="expiryDate" class="form-control">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Coupon</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
