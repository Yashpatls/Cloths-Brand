<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{admin/admin-fragments :: admin-head('Customer Accounts')}"></th:block>
</head>
<body class="admin-body">

  <div th:replace="~{admin/admin-fragments :: sidebar}"></div>

  <main class="admin-main">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1">Registered Clients</h2>
        <span class="text-muted small">Customer profiles, contact telephone, and saved delivery locations</span>
      </div>
    </div>

    <div class="admin-table">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Client Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Registered Address</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="c : ${customers}">
              <td th:text="${c.id}">1</td>
              <td><strong class="text-dark" th:text="${c.name}">Customer Name</strong></td>
              <td th:text="${c.email}">email@domain.com</td>
              <td th:text="${c.phone != null ? c.phone : 'Not provided'}">+91 ...</td>
              <td class="small text-muted" style="max-width: 300px;" th:text="${c.address != null ? c.address : 'No address saved'}">Address</td>
              <td>
                <span class="badge" th:classappend="${c.enabled} ? 'bg-success' : 'bg-danger'"
                      th:text="${c.enabled ? 'Active' : 'Suspended'}">Active</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
