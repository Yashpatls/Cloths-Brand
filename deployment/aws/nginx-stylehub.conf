# ==============================================================================
# StyleHub Nginx Reverse Proxy Configuration
# ==============================================================================

server {
    listen 80;
    server_name _;

    # Client upload limits (matches Spring Boot multipart limits)
    client_max_body_size 20M;

    # Gzip compression for high-performance delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static uploads caching
    location /uploads/ {
        alias /opt/stylehub/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all web requests to Spring Boot application running on port 8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed for live notifications)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
