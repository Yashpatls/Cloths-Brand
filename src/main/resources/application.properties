# Application Properties - StyleHub Local & Default Environment
spring.application.name=StyleHub
server.port=${PORT:8085}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/stylehub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Settings
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Local File Storage Path (for images when AWS S3 is not active)
stylehub.upload.dir=${UPLOAD_DIR:uploads}

# AWS Cloud Settings
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET:stylehub-media-bucket}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_KEY:}
aws.cloudfront.domain=${AWS_CLOUDFRONT_DOMAIN:}

# Razorpay Payment Gateway Settings (Test Mode)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_l99uVs9OtIIqFL}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:jSfm5ENBwuQRwAqPNViQwHCm}
razorpay.currency=INR

# Store Settings Defaults
stylehub.store.name=StyleHub
stylehub.store.currency=₹
stylehub.store.support-email=support@stylehub.local
stylehub.store.support-phone=+91 (022) 555-0199
stylehub.store.free-shipping-threshold=1500.00
stylehub.store.flat-shipping-fee=99.00
stylehub.store.tax-rate=0.05

# Error handling
server.error.include-message=never
server.error.include-stacktrace=never
