<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{admin/admin-fragments :: admin-head('Category Management')}"></th:block>
</head>
<body class="admin-body">

  <div th:replace="~{admin/admin-fragments :: sidebar}"></div>

  <main class="admin-main">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1">Wardrobe Categories</h2>
        <span class="text-muted small">Manage clothing categories, display orders, and landing images</span>
      </div>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
      <span th:text="${successMessage}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
      <!-- Create / Edit Form -->
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm p-4 bg-white rounded-3">
          <h5 class="fw-bold mb-3">Add / Edit Category</h5>
          <form th:action="@{/admin/categories/save}" th:object="${newCategory}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
              <label class="form-label small fw-bold">Category Name</label>
              <input type="text" th:field="*{name}" class="form-control" required placeholder="e.g. Outerwear">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">URL Slug</label>
              <input type="text" th:field="*{slug}" class="form-control" placeholder="e.g. outerwear">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Description</label>
              <textarea th:field="*{description}" class="form-control" rows="3" placeholder="Category brief..."></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Banner Image URL</label>
              <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://...">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Upload Image</label>
              <input type="file" name="imageFile" class="form-control" accept="image/*">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Save Category</button>
          </form>
        </div>
      </div>

      <!-- Categories Table -->
      <div class="col-lg-8">
        <div class="admin-table">
          <div class="table-responsive">
            <table class="table align-middle">
              <thead>
                <tr>
                  <th>Banner</th>
                  <th>Category</th>
                  <th>Slug</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="c : ${categories}">
                  <td style="width: 70px;">
                    <img th:src="${c.imageUrl}" class="rounded" style="width: 50px; height: 50px; object-fit: cover;" th:alt="${c.name}">
                  </td>
                  <td>
                    <strong class="d-block" th:text="${c.name}">Name</strong>
                    <small class="text-muted" th:text="${c.description}">Desc</small>
                  </td>
                  <td><code th:text="${c.slug}">slug</code></td>
                  <td>
                    <span class="badge" th:classappend="${c.active} ? 'bg-success' : 'bg-secondary'"
                          th:text="${c.active ? 'Active' : 'Archived'}">Active</span>
                  </td>
                  <td>
                    <form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Archive this category?')">
                      <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-archive"></i></button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
