# Test Configuration - Uses H2 In-Memory Database
spring.application.name=StyleHub-Test
spring.datasource.url=jdbc:h2:mem:stylehubtest;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.thymeleaf.cache=false

# Mock properties
razorpay.key.id=rzp_test_mock
razorpay.key.secret=mock_secret
aws.region=ap-south-1
aws.s3.bucket=stylehub-test-bucket
