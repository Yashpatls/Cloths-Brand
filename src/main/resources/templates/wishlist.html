<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments :: head('My Wishlist')}"></th:block>
</head>
<body>

  <div th:replace="~{fragments :: header}"></div>

  <main class="container py-5">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-4 pb-2 border-bottom">
      <div>
        <span class="text-uppercase small fw-bold text-muted">SAVED STYLES</span>
        <h1 class="display-6 font-serif mt-1 mb-0">My Wishlist</h1>
      </div>
      <button type="button" class="btn-luxury-back ripple-effect" onclick="handlePageBack(event)">
        <i class="bi bi-arrow-left arrow-icon"></i>
        <span>Continue Shopping</span>
      </button>
    </div>

    <div th:if="${wishlist.isEmpty()}" class="text-center py-5 bg-light rounded-3">
      <i class="bi bi-heart fs-1 text-muted d-block mb-3"></i>
      <h4 class="font-serif">Your wishlist is currently empty</h4>
      <p class="text-muted">Tap the heart icon on any garment to save it for later.</p>
      <a href="/shop" class="btn btn-fashion-dark mt-2">Explore Catalog</a>
    </div>

    <div class="row g-4" th:unless="${wishlist.isEmpty()}">
      <div class="col-6 col-md-4 col-lg-3" th:each="w : ${wishlist}">
        <div class="product-card">
          <div class="product-thumb">
            <span class="product-badge sale" th:if="${w.product.discountPrice != null}">Sale</span>
            <a th:href="@{/products/{id}(id=${w.product.id})}">
              <img th:src="${w.product.imageUrl}" th:alt="${w.product.name}">
            </a>
          </div>
          <div class="product-info">
            <div class="product-cat" th:text="${w.product.categoryName}">Category</div>
            <a th:href="@{/products/{id}(id=${w.product.id})}">
              <h3 class="product-title" th:text="${w.product.name}">Product Name</h3>
            </a>
            <div class="product-price mb-3">
              <span th:if="${w.product.discountPrice != null}" th:text="'₹' + ${w.product.discountPrice}">₹0</span>
              <span th:classappend="${w.product.discountPrice != null} ? 'price-original' : ''" th:text="'₹' + ${w.product.price}">₹0</span>
            </div>

            <!-- Move to bag action -->
            <form th:action="@{/wishlist/move-to-cart}" method="post" class="d-flex gap-2">
              <input type="hidden" name="productId" th:value="${w.product.id}">
              <button type="submit" class="btn btn-sm btn-fashion-dark flex-grow-1">
                <i class="bi bi-bag-plus me-1"></i> Move to Bag
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div th:replace="~{fragments :: footer}"></div>

</body>
</html>
