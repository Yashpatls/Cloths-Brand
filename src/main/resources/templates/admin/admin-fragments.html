<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="admin-head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title != null ? title + ' | StyleHub Admin' : 'StyleHub Management Suite'}">StyleHub Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">

  <!-- Admin Sidebar -->
  <aside th:fragment="sidebar" class="admin-sidebar">
    <a href="/admin" class="brand">
      STYLE<span>HUB</span> <small class="d-block text-secondary" style="font-size: 0.65rem; letter-spacing: 1px;">CONTROL PANEL</small>
    </a>
    <ul class="admin-nav">
      <li><a href="/admin"><i class="bi bi-grid-1x2"></i> Dashboard</a></li>
      <li><a href="/admin/products"><i class="bi bi-tag"></i> Products</a></li>
      <li><a href="/admin/combos"><i class="bi bi-gift"></i> Combo Packages</a></li>
      <li><a href="/admin/categories"><i class="bi bi-folder2"></i> Categories</a></li>
      <li><a href="/admin/inventory"><i class="bi bi-boxes"></i> Inventory</a></li>
      <li><a href="/admin/orders"><i class="bi bi-bag-check"></i> Orders</a></li>
      <li><a href="/admin/customers"><i class="bi bi-people"></i> Customers</a></li>
      <li><a href="/admin/payments"><i class="bi bi-credit-card"></i> Payments</a></li>
      <li><a href="/admin/coupons"><i class="bi bi-ticket-perforated"></i> Coupons</a></li>
      <li><a href="/admin/reports"><i class="bi bi-graph-up"></i> Reports</a></li>
      <li><a href="/admin/settings"><i class="bi bi-gear"></i> Settings</a></li>
      <li class="mt-4 pt-3 border-top border-secondary">
        <a href="/" target="_blank"><i class="bi bi-box-arrow-up-right"></i> View Storefront</a>
      </li>
      <li>
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="btn btn-link text-start text-danger p-2 text-decoration-none w-100 d-flex align-items-center gap-2 small">
            <i class="bi bi-box-arrow-left"></i> Sign Out
          </button>
        </form>
      </li>
    </ul>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
